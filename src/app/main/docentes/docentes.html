<section id="docentes" class="sec sec-soft">
  <div class="container">
    <div class="sec-head">
      <span class="eyebrow">Nuestro equipo</span>
      <h2 class="h2">Docentes que inspiran</h2>
      <p class="lead-x">Filtra por idioma y conoce su especialidad y experiencia.</p>
    </div>
    <ul class="nav nav-pills justify-content-center gap-2 mb-5">
      @for (f of filtros; track f) {
        <li class="nav-item">
          <button type="button" class="nav-link" [class.active]="filtro() === f" (click)="filtro.set(f)">{{ f }}</button>
        </li>
      }
    </ul>
    <div class="row g-4">
      @for (d of visibles(); track d.n) {
        <div class="col-md-6 col-lg-4">
          <div class="card-x">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="avatar">{{ iniciales(d.n) }}</div>
              <div><h3 class="mb-0 fs-5">{{ d.n }}</h3><span class="chip mt-1">{{ d.i }}</span></div>
            </div>
            <p class="mb-1"><strong class="text-dark">Especialidad:</strong> {{ d.e }}</p>
            <p class="mb-0"><i class="bi bi-patch-check-fill text-primary-x me-1"></i>{{ d.x }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
