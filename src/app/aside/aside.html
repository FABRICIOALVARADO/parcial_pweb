<aside class="info">
  <div class="container">
    <div class="row g-3">
      @for (i of items; track i.t) {
        <div class="col-md-4">
          <div class="item">
            <div class="ico mb-0"><i class="bi {{ i.i }}"></i></div>
            <div><small>{{ i.t }}</small><strong>{{ i.v }}</strong></div>
          </div>
        </div>
      }
    </div>
  </div>
</aside>
